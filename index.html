function submitAddSiswa() {
  var nis = document.getElementById('addNis').value.trim();
  var nama = document.getElementById('addNama').value.trim();
  var kid = document.getElementById('addKelas').value;
  if (!nis || !nama) { alert('Harap isi NIS dan Nama!'); return; }
  callApi('addSiswa', [{ nis: nis, nama: nama, kelasId: kid }], function(res){
    if (res && res.success) { closeModal(); showToast('Siswa ditambahkan!', 'success'); renderSiswa(); }
  });
}

function hapusSiswaAction(id, name) {
  if (!confirm('Hapus siswa ' + name + '? Seluruh riwayat presensi siswa ini akan dihapus.')) return;
  callApi('removeSiswa', [id], function(res){
    if (res && res.success) { showToast('Siswa dihapus.', 'success'); renderSiswa(); }
  });
}

  ca.innerHTML = '<div class="text-center" style="padding:40px;">⏳ Memuat data ekskul...</div>';

    var ekskul = data.ekskul || [];
    var html = '<div class="card">' +
      '<div class="card-header">' +
        '<h3 class="card-title">Daftar Ekstrakurikuler (' + ekskul.length + ')</h3>' +

  var name = document.getElementById('addEName').value.trim();

  var jam = document.getElementById('addEJam').value.trim();
  if (!name) { alert('Nama ekskul wajib diisi!'); return; }
  callApi('addEkskul', [{ name: name, hari: hari, jam: jam, isBuka: 'BUKA' }], function(res){
    if (res && res.success) { closeModal(); showToast('Ekskul ditambahkan!', 'success'); renderEkskul(); }

function downloadCsvAction(type) {
  showToast('Memproses file unduhan...', 'info');
  var fn = (type === 'kelas') ? 'exportCsvKelas' : 'exportCsvEkskul';
  callApi(fn, [], function(csvContent) {
    if (!csvContent) {
      alert('Gagal menghasilkan file CSV.');
      return;
    }
    // Unduh dengan BOM UTF-8 agar karakter rapi di Excel
    var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Laporan_' + (type === 'kelas' ? 'Rekap_Kelas' : 'Detail_Absensi') + '_' + new Date().toISOString().split('T')[0] + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('File CSV berhasil diunduh!', 'success');
  });
}

    var jmlAbsen = relevantAbs.length;

      var s = sesiMap[k];

  callApi('getAllData', [], function(data) {
    if (data && data.appConfig) saveLogoConfig(data.appConfig, true);

    var allKelas = data.kelas || [];
    var allSiswa = data.siswa || [];
    var allReg = data.keikutsertaan || [];
    var allAbs = data.absensi || [];
    var allEkskul = data.ekskul || [];

    var eMap = {};
    allEkskul.forEach(function(e){ eMap[e.id] = e.name; });

    var isWaliBound = (CU.role === 'walikelas' && CU.kelasId);
    var myKelas = isWaliBound ? allKelas.find(function(k){ return k.id === CU.kelasId; }) : null;

    var relevantSiswa = isWaliBound ? allSiswa.filter(function(s){ return s.kelasId === CU.kelasId; }) : allSiswa;
    var relevantSids = relevantSiswa.map(function(s){ return s.id; });

    // Siswa yang ikut ekskul
    var enrolledSids = {};
    allReg.forEach(function(r){
      if (!isWaliBound || relevantSids.indexOf(r.siswaId) >= 0) {
        enrolledSids[r.siswaId] = true;
      }
    });
    var jmlIkutEkskul = Object.keys(enrolledSids).length;
    var persenIkut = relevantSiswa.length > 0 ? Math.round((jmlIkutEkskul / relevantSiswa.length) * 100) : 0;

    // Perhitungan ketidakhadiran per siswa
    var studentAbsMap = {};
    var totalAbsRelevant = 0;
    allAbs.forEach(function(a){
      if (isWaliBound && relevantSids.indexOf(a.siswaId) < 0) return;
      totalAbsRelevant++;

      if (!studentAbsMap[a.siswaId]) {
        studentAbsMap[a.siswaId] = { total: 0, sakit: 0, izin: 0, alpha: 0, ekskulMap: {} };
      }
      studentAbsMap[a.siswaId].total++;
      var st = (a.status || '').toLowerCase();
      if (st === 'sakit') studentAbsMap[a.siswaId].sakit++;
      else if (st === 'izin') studentAbsMap[a.siswaId].izin++;
      else if (st === 'alpha') studentAbsMap[a.siswaId].alpha++;

      var ename = eMap[a.ekskulId] || a.ekskulId;
      studentAbsMap[a.siswaId].ekskulMap[ename] = (studentAbsMap[a.siswaId].ekskulMap[ename] || 0) + 1;
    });

    // Siswa dengan absensi tertinggi (peringatan wali kelas)
    var perhatianList = [];
    relevantSiswa.forEach(function(s){
      var stat = studentAbsMap[s.id];
      if (stat && stat.total > 0) {
        var kObj = allKelas.find(function(k){ return k.id === s.kelasId; });
        var ekskulRincian = [];
        for (var en in stat.ekskulMap) {
          ekskulRincian.push(en + ' (' + stat.ekskulMap[en] + 'x)');
        }
        perhatianList.push({
          siswa: s,
          kelasName: kObj ? kObj.name : s.kelasId,
          total: stat.total,
          sakit: stat.sakit,
          izin: stat.izin,
          alpha: stat.alpha,
          rincian: ekskulRincian.join(', ')
        });
      }
    });
    perhatianList.sort(function(a, b){ return b.total - a.total; });
    var topPerhatian = perhatianList.slice(0, 5);

    // Hitung per kelas
    var kMap = {};
    var displayKelasList = isWaliBound && myKelas ? [myKelas] : allKelas;
    displayKelasList.forEach(function(k){
      var siswaDiKelas = allSiswa.filter(function(s){ return s.kelasId === k.id; });
      var sidsInKelas = siswaDiKelas.map(function(s){ return s.id; });
      var absDiKelas = allAbs.filter(function(a){ return sidsInKelas.indexOf(a.siswaId) >= 0; });
      var ikutDiKelas = siswaDiKelas.filter(function(s){ return enrolledSids[s.id]; });

      kMap[k.id] = {
        kelas: k,
        totalSiswa: siswaDiKelas.length,
        ikutEkskul: ikutDiKelas.length,
        totalAbsen: absDiKelas.length,
        sakit: absDiKelas.filter(function(x){ return (x.status||'').toLowerCase() === 'sakit'; }).length,
        izin: absDiKelas.filter(function(x){ return (x.status||'').toLowerCase() === 'izin'; }).length,
        alpha: absDiKelas.filter(function(x){ return (x.status||'').toLowerCase() === 'alpha'; }).length
      };
    });

    var bannerSubtitle = isWaliBound && myKelas ?
      ('Akun Wali Kelas ' + escapeHtml(myKelas.name) + ' aktif. Pantau keikutsertaan dan ketidakhadiran peserta didik kelas binaan Anda untuk pembinaan, konseling, dan pengisian buku rapor.') :
      'Pantau akumulasi ketidakhadiran peserta didik per kelas secara rinci untuk keperluan pembinaan, konseling, dan pelaporan buku rapor.';

    var bannerBadge = isWaliBound && myKelas ?
      ('👩‍🏫 PORTAL WALI KELAS: ' + escapeHtml(myKelas.name.toUpperCase())) :
      '👩‍🏫 PORTAL RESMI WALI KELAS';

    var html = '' +
      // HERO BANNER WALI KELAS
      '<div class="card" style="background:linear-gradient(135deg, #0f766e 0%, #0d9488 100%);color:#fff;border:none;margin-bottom:16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">' +
          '<div>' +
            '<div style="display:inline-block;padding:2px 8px;background:rgba(255,255,255,0.2);border-radius:12px;font-size:11px;font-weight:600;margin-bottom:6px;">' + bannerBadge + '</div>' +
            '<h2 style="font-size:20px;font-weight:800;margin:0 0 4px 0;color:#fff;">Selamat Datang, ' + escapeHtml(CU.name) + '! 📋</h2>' +
            '<p style="font-size:12px;opacity:0.9;margin:0;max-width:540px;">' + bannerSubtitle + '</p>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn" style="background:#fff;color:#0f766e;font-weight:700;border:none;" onclick="goTo(\'laporan-kelas\'' + (isWaliBound ? ',\'' + CU.kelasId + '\'' : '') + ')">📈 Buka Rekap ' + (isWaliBound && myKelas ? escapeHtml(myKelas.name) : 'Kelas') + '</button>' +
            '<button class="btn" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);" onclick="goTo(\'unduh\')">⬇️ Unduh CSV Excel</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // 4 STATS WALI KELAS
      '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px;margin-bottom:16px;">' +
        '<div class="card" style="margin-bottom:0;padding:16px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="font-size:11px;color:var(--gray-500);font-weight:600;">' + (isWaliBound ? 'Kelas Binaan' : 'Total Rombel / Kelas') + '</div>' +
            '<span style="font-size:18px;">🏫</span>' +
          '</div>' +
          '<div style="font-size:' + (isWaliBound ? '20px' : '26px') + ';font-weight:800;color:var(--primary);margin-top:4px;">' + (isWaliBound && myKelas ? escapeHtml(myKelas.name) : allKelas.length) + '</div>' +
          '<div style="font-size:11px;color:var(--gray-500);margin-top:2px;">' + (isWaliBound ? 'Rombel binaan Anda' : 'Kelas 7A - 9B') + '</div>' +
        '</div>' +
        '<div class="card" style="margin-bottom:0;padding:16px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="font-size:11px;color:var(--gray-500);font-weight:600;">Peserta Didik</div>' +
            '<span style="font-size:18px;">👨‍🎓</span>' +
          '</div>' +
          '<div style="font-size:26px;font-weight:800;color:var(--info);margin-top:4px;">' + relevantSiswa.length + '</div>' +
          '<div style="font-size:11px;color:var(--gray-500);margin-top:2px;">' + (isWaliBound ? 'Siswa di kelas ini' : 'Siswa binaan sekolah') + '</div>' +
        '</div>' +
        '<div class="card" style="margin-bottom:0;padding:16px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="font-size:11px;color:var(--gray-500);font-weight:600;">Partisipasi Ekskul</div>' +
            '<span style="font-size:18px;">✨</span>' +
          '</div>' +
          '<div style="font-size:26px;font-weight:800;color:var(--success);margin-top:4px;">' + persenIkut + '%</div>' +
          '<div style="font-size:11px;color:var(--gray-500);margin-top:2px;">' + jmlIkutEkskul + ' dari ' + relevantSiswa.length + ' siswa terdaftar</div>' +
        '</div>' +
        '<div class="card" style="margin-bottom:0;padding:16px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="font-size:11px;color:var(--gray-500);font-weight:600;">Ketidakhadiran Tercatat</div>' +
            '<span style="font-size:18px;">⚠️</span>' +
          '</div>' +
          '<div style="font-size:26px;font-weight:800;color:var(--danger);margin-top:4px;">' + totalAbsRelevant + '</div>' +
          '<div style="font-size:11px;color:var(--gray-500);margin-top:2px;">' + (isWaliBound ? 'Total S/I/A siswa di kelas ini' : 'Total akumulasi S/I/A') + '</div>' +
        '</div>' +
      '</div>' +

      // PERINGATAN SISWA DENGAN KETIDAKHADIRAN TERTINGGI (TOP ATTENTION)
      '<div class="card">' +
        '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">' +
          '<h3 class="card-title">⚠️ Siswa Perlu Perhatian (Ketidakhadiran Terbanyak)</h3>' +
          '<button class="btn btn-outline btn-sm" onclick="goTo(\'laporan-kelas\'' + (isWaliBound ? ',\'' + CU.kelasId + '\'' : '') + ')">Lihat Rekap Kelas ➡️</button>' +
        '</div>';

    if (topPerhatian.length === 0) {
      html += '<div style="padding:20px;text-align:center;color:var(--success);font-weight:600;">' +
        '🎉 Tidak ada catatan ketidakhadiran siswa! Semua siswa aktif mengikuti kegiatan.' +
      '</div>';
    } else {
      html += '<div class="table-responsive"><table class="table">' +
        '<thead><tr>' +
          '<th>Nama Siswa</th>' +
          '<th>Kelas</th>' +
          '<th class="text-center">Sakit</th>' +
          '<th class="text-center">Izin</th>' +
          '<th class="text-center">Alpha</th>' +
          '<th class="text-center">Total Absen</th>' +
          '<th>Rincian di Cabang Ekskul</th>' +
        '</tr></thead><tbody>';

      topPerhatian.forEach(function(item) {
        html += '<tr>' +
          '<td><b>' + escapeHtml(item.siswa.nama) + '</b> <span class="text-muted" style="font-size:11px;">(' + item.siswa.nis + ')</span></td>' +
          '<td><span class="badge badge-gray">' + escapeHtml(item.kelasName) + '</span></td>' +
          '<td class="text-center"><span style="color:var(--warning);font-weight:700;">' + item.sakit + '</span></td>' +
          '<td class="text-center"><span style="color:var(--info);font-weight:700;">' + item.izin + '</span></td>' +
          '<td class="text-center"><span style="color:var(--danger);font-weight:700;">' + item.alpha + '</span></td>' +
          '<td class="text-center"><span class="badge ' + (item.total >= 3 ? 'badge-danger' : 'badge-warning') + '" style="font-size:12px;">' + item.total + 'x Absen</span></td>' +
          '<td><span style="font-size:11px;color:var(--gray-700);">' + escapeHtml(item.rincian) + '</span></td>' +
        '</tr>';
      });

      html += '</tbody></table></div>';
    }

    html += '</div>';

    // RINGKASAN REKAP PER KELAS
    html += '<div class="card">' +
      '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">' +
        '<h3 class="card-title">🏫 Ringkasan Ketidakhadiran per Kelas Binaan</h3>' +
        '<span class="badge badge-info">' + allKelas.length + ' Kelas</span>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:12px;">';

    allKelas.forEach(function(k) {
      var inf = kMap[k.id] || { totalSiswa: 0, ikutEkskul: 0, totalAbsen: 0, sakit: 0, izin: 0, alpha: 0 };
      html += '<div style="border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:14px;background:#fff;display:flex;flex-direction:column;justify-content:space-between;">' +
        '<div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
            '<h4 style="font-size:16px;font-weight:800;margin:0;color:var(--primary);">' + escapeHtml(k.name) + '</h4>' +
            '<span class="badge badge-gray">' + inf.totalSiswa + ' Siswa</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--gray-600);margin-bottom:8px;">' +
            '<div>✨ <b>Ikut Ekskul:</b> ' + inf.ikutEkskul + ' siswa</div>' +
            '<div style="margin-top:2px;">⚠️ <b>Ketidakhadiran:</b> ' +
              '<span style="color:var(--warning);font-weight:700;">' + inf.sakit + ' S</span> • ' +
              '<span style="color:var(--info);font-weight:700;">' + inf.izin + ' I</span> • ' +
              '<span style="color:var(--danger);font-weight:700;">' + inf.alpha + ' A</span> ' +
              '(Total ' + inf.totalAbsen + 'x)' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:8px;padding-top:10px;border-top:1px dashed var(--gray-200);">' +
          '<button class="btn btn-outline btn-sm" style="width:100%;" onclick="goTo(\'laporan-kelas\', \'' + k.id + '\')">' +
            '📊 Buka Rekap ' + escapeHtml(k.name) + ' ➡️' +
          '</button>' +
        '</div>' +
      '</div>';
    });

    html += '</div></div>';

    ca.innerHTML = html;
  });
}

function renderLaporanAdmin() { renderLaporanKelas(); }

// ============================================================
// INISIALISASI
// ============================================================
window.addEventListener('DOMContentLoaded', function() {
  loadLocalDB();
  renderAllLogos();
  if (isGas()) {
    callApi('getAppConfigServer', [], function(cfg){
      if (cfg) saveLogoConfig(cfg, true);
    });
  }

  // Cek Parameter Portal URL
  var urlParams = new URLSearchParams(window.location.search);
  var ssoPortalUrl = urlParams.get('portal_url');
  if (ssoPortalUrl) {
    sessionStorage.setItem('ekskul_portal_url', ssoPortalUrl);
  }
  var effectivePortalUrl = ssoPortalUrl || sessionStorage.getItem('ekskul_portal_url');
  var btnPortal = document.getElementById('btnKembaliPortalEkskul');
  if (btnPortal && effectivePortalUrl) {
    btnPortal.href = effectivePortalUrl;
    btnPortal.style.display = 'inline-flex';
  }

  var elU = document.getElementById('loginU');
  var elP = document.getElementById('loginP');
  if (elU) {
    elU.focus();
    elU.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  }
  if (elP) {
    elP.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  }
});
</script>
